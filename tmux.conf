setw -g mouse on

# Forward copies to the outer terminal via OSC 52 (required to reach the
# local macOS pasteboard from this remote box — there is no DISPLAY/xclip path).
set -g set-clipboard on

# Pane border: index + everything pane-status.sh resolves (🔀 worktree marker,
# branch, and at most one project-published state glyph) + the @pane_cmd slot.
#
# All of it is *pulled* at render time — nothing writes into tmux. The 🔀 and
# branch are path-derived; the state glyph comes from files a project drops in
# its git common dir (see pane-status.sh and README.md § state protocol). One
# #() call rather than the two this format used to inline, so the subprocess
# count per repaint is halved even though it now resolves strictly more.
#
# @pane_cmd is the one thing that must still be *pushed*: it carries the tool
# the Claude Code hook is currently running, which is not representable on
# disk. It has exactly one writer, so it needs no coordination.
setw -g pane-border-status top
setw -g pane-border-format "#[reverse]#{pane_index} #[bold]#(~/.tmux/pane-status.sh '#{pane_id}' '#{pane_current_path}')#[nobold]#{?@pane_cmd, │ #{@pane_cmd},}#[default]"

# Border/status repaint cadence. Pane borders re-run their #() commands once
# per status-interval and #() serves the *previous* result while the new one
# runs, so a state change can take up to two intervals to appear. 15s (the
# default) made a gate glyph lag ~30s; 5s keeps it under ~10s. Affordable
# because the format above went from two subprocesses per pane to one.
set -g status-interval 5

# --- Per-project colour scheme -------------------------------------------
# I work several projects at once, one tmux session each, and want the bar to
# tint per project so they are distinguishable at a glance.
#
# THE PALETTE LIVES IN EACH PROJECT, NOT HERE. ~/.tmux/project-theme.sh walks
# up from a session's working directory looking for a `.tmux-theme` file and
# applies whatever it finds; adding a project is a file in that project, and
# neither this config nor the script needs touching. The six @thm_* roles below
# are the *defaults* -- a project with no `.tmux-theme` (or one that names only
# some roles) inherits them via tmux's own option inheritance, so an unthemed
# project renders in the neutral grey below rather than uncoloured.
#
# `.tmux-theme` is `role=colour` per line; see the header of
# ~/.tmux/project-theme.sh for the format, the whitelist, and the roles.
#
# The defaults are deliberately a NEUTRAL GREY rather than any project's
# palette: an unthemed project should read as "no palette yet", not as a
# specific project. (They were blue until 2026-08-01, which made a new project
# indistinguishable from the one whose palette the defaults happened to carry.)
#
# To see which projects are themed and how:
#   tmux list-sessions -F '#{session_name} #{pane_current_path}'
#   ...then `cat <path>/.tmux-theme` for any that resolve to one.
set -g @thm_bar    colour236  # status bar background (dark)
set -g @thm_soft   colour250  # bar + inactive window text (light)
set -g @thm_badge  colour240  # session badge / clock / message background
set -g @thm_accent colour248  # current window highlight + hostname
set -g @thm_dim    colour238  # inactive pane border
set -g @thm_bright colour252  # active pane border

# FORMAT options expand #{...}, so these read the roles directly and need no
# per-project variants.
set -g status-left "#[bg=#{@thm_badge},fg=colour231,bold] #S #[bg=#{@thm_bar},fg=#{@thm_badge}]"
set -g status-left-length 30
set -g status-right "#[fg=#{@thm_accent}]#H #[bg=#{@thm_badge},fg=colour231,bold] %H:%M "
setw -g window-status-format "#[fg=#{@thm_soft}] #I #W "
setw -g window-status-current-format "#[bg=#{@thm_accent},fg=#{@thm_bar},bold] #I #W "

# STYLE options are NOT format-expanded (tmux(1) STYLES: styles embed in
# formats, not the reverse), so #{@thm_...} would be stored verbatim as a
# broken style. These literals are the pre-hook default; project-theme.sh
# overwrites them per session with the resolved role values.
set -g status-style "bg=colour236,fg=colour250"
set -g message-style "bg=colour240,fg=colour231"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour252"

# Re-apply on every event that can change which project a session shows.
# The two creation hooks pass #{session_path} explicitly: when they fire the
# new pane has no shell yet, so #{pane_current_path} reads back empty or stale.
set-hook -g client-session-changed 'run-shell "~/.tmux/project-theme.sh #{session_name}"'
set-hook -g after-rename-session   'run-shell "~/.tmux/project-theme.sh #{session_name}"'
set-hook -g session-created        'run-shell "~/.tmux/project-theme.sh #{session_name} #{session_path}"'
set-hook -g after-new-window       'run-shell "~/.tmux/project-theme.sh #{session_name} #{session_path}"'

# And once at load, for sessions that already exist across a config reload.
run-shell "~/.tmux/project-theme.sh"

# --- Plugins (TPM) -------------------------------------------------------
# tmux-yank: y in copy-mode / drag-to-yank → system clipboard (OSC 52 here)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

# Keep this line at the very bottom of the file.
run '~/.tmux/plugins/tpm/tpm'
